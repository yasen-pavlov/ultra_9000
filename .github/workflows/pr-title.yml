name: PR title

# Separate from CI so that editing a PR title or body (ticking template checkboxes)
# re-checks only the title instead of re-running the whole pipeline.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: pr-title-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR title
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read # read the PR title
    steps:
      # Squash merges use the PR title as the commit subject; release notes are built from it.
      - name: Check Conventional Commit title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            design
            style
            test
            build
            ci
            chore
            revert
          requireScope: false
