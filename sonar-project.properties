# SonarQube Cloud analysis, run from CI (.github/workflows/ci.yml, job "SonarQube Cloud").
# Automatic Analysis must be disabled in the project settings. The scan waits for the
# quality gate and fails the job (and with it `CI ok`) when the gate fails.
sonar.qualitygate.wait=true
sonar.organization=yasen-pavlov
sonar.projectKey=yasen-pavlov_ultra_9000
sonar.projectName=Ultra 9000
sonar.sourceEncoding=UTF-8

# Test code is classified as tests, never counted as covered source: Rust tests live in
# dedicated `tests.rs` / `test_support.rs` module files next to the code they test, the
# real-runtime GUI tests in src-tauri/tests/, frontend tests in src/**/*.test.ts with shared
# helpers in src/test/. No coverage exclusions: every production line counts, including the
# platform hosts and bootstrap.
sonar.sources=src,src-tauri/src
sonar.tests=src,src-tauri/src,src-tauri/tests
sonar.test.inclusions=src/**/*.test.ts,src/test/**,src-tauri/src/**/tests.rs,src-tauri/src/**/test_support.rs,src-tauri/tests/**
sonar.exclusions=vendor/**,docs/**,dist/**,src-tauri/target/**,src-tauri/gen/**,src-tauri/icons/**,src/**/*.test.ts,src/test/**,src-tauri/src/**/tests.rs,src-tauri/src/**/test_support.rs,src-tauri/tests/**

# Rust: Sonar's own Rust rules run on the sources. Clippy is not run or imported here: CI
# gates on `cargo clippy -D warnings`, so a report would always be empty, and running it
# would need a full compile in the scan job.
sonar.rust.cargo.manifestPaths=src-tauri/Cargo.toml
sonar.rust.clippy.enabled=false
# Linux and macOS reports are merged per line; macos.rs is only compiled (and covered) on macOS.
sonar.rust.lcov.reportPaths=lcov.info,lcov-macos.info

# TypeScript: analysed natively; Vitest coverage from `bun run test:coverage`. Svelte: Sonar
# has no Svelte analyzer, so .svelte components are not analysed here; svelte-check and
# ESLint (eslint-plugin-svelte) gate them in CI instead.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
