# cargo-deny policy for the Ultra 9000 dependency graph.
# Run from the repository root: `cargo deny --manifest-path src-tauri/Cargo.toml check`.
# The vendored Alacritty crates under vendor/ are path dependencies of the app crate and
# are checked as part of its graph.

[graph]
# Only the shipped platforms; Windows/Android/iOS/wasm-only crates are out of scope.
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]
all-features = false

[advisories]
# Vulnerability and unsound advisories fail for the whole graph. Unmaintained-crate notices
# fail only for direct dependencies; transitive ones come from upstream stacks (Tauri, GTK)
# we cannot swap out ourselves and are not reported.
unmaintained = "workspace"
unsound = "all"
yanked = "deny"
ignore = [
  # glib 0.18 (Tauri's GTK3 stack: gtk/webkit2gtk 0.18, no 0.18.x fix). Only
  # glib::Variant::array_iter_str() reaches the unsound iterator; no crate in the graph or
  # this repo calls it. Revisit when Tauri moves off gtk-rs 0.18.
  { id = "RUSTSEC-2024-0429", reason = "unsound VariantStrIter not called anywhere; fix needs glib 0.20 (Tauri GTK stack)" },
]

[licenses]
confidence-threshold = 0.93
# Permissive licenses and MPL-2.0 (file-level copyleft, satisfied by distributing the
# unmodified crate sources' notices; used by cssparser/selectors in Tauri's HTML tooling and
# option-ext via dirs). Every entry is in use by the current graph.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
# The app crate itself (publish = false) is covered by the repository license files.
ignore = true

[bans]
# Tauri, GTK and the vendored terminal pull several major versions of common crates; report
# them without failing.
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies of the unpublished app crate (the vendored Alacritty crates).
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
