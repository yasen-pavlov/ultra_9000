# Release notes for GitHub releases (.github/workflows/release.yml runs
# `git cliff --current`). Commits on main are squash-merged PRs with Conventional Commit
# subjects. Only the release notes are generated; there is no committed changelog.

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{% if commit.breaking %}**BREAKING** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^design", group = "<!-- 3 -->Design" },
  { message = "^revert", group = "<!-- 4 -->Reverts" },
  { message = "^refactor", group = "<!-- 5 -->Refactoring" },
  { message = "^docs", group = "<!-- 6 -->Documentation" },
  { message = "^(build|ci|chore|style|test)", skip = true },
]
